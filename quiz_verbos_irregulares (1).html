<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz de Verbos Irregulares</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #151a2e, #242b4a);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: min(700px, 100%);
    background: #fff;
    color: #1b1b1b;
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  h1 { text-align: center; margin: 0 0 8px; }
  .subtitle { text-align: center; color: #666; margin-bottom: 25px; }
  .top {
    display: flex;
    justify-content: space-between;
    background: #f3f4f8;
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 25px;
    font-weight: bold;
  }
  .verb {
    text-align: center;
    font-size: 42px;
    font-weight: 800;
    margin: 30px 0;
    color: #252d61;
  }
  .translation {
    text-align: center;
    color: #777;
    margin-top: -20px;
    margin-bottom: 22px;
  }
  .fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }
  label { font-weight: bold; display: block; margin-bottom: 7px; }
  input {
    width: 100%;
    padding: 14px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 17px;
    outline: none;
  }
  input:focus { border-color: #5965d8; }
  button {
    width: 100%;
    border: 0;
    border-radius: 11px;
    padding: 14px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 18px;
    background: #5965d8;
    color: white;
  }
  button:hover { background: #4652c7; }
  button.secondary {
    background: #eceef8;
    color: #30365c;
    margin-top: 10px;
  }
  .result {
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    font-weight: bold;
    display: none;
  }
  .correct { background: #dff7e7; color: #16733a; }
  .wrong { background: #ffe3e3; color: #a51e1e; }
  .answer { margin-top: 7px; font-weight: normal; }
  .hidden { display: none; }
  .progress {
    height: 8px;
    background: #e7e7e7;
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .bar {
    height: 100%;
    background: #5965d8;
    width: 0%;
    transition: width .25s;
  }
  .finish { text-align: center; }
  .score {
    font-size: 55px;
    font-weight: 900;
    color: #5965d8;
    margin: 20px 0;
  }
  @media(max-width:550px) {
    .fields { grid-template-columns: 1fr; }
    .verb { font-size: 34px; }
  }
</style>
</head>
<body>
<div class="card">
  <div id="quiz">
    <h1>📚 Verbos irregulares</h1>
    <div class="subtitle">Escribe el pasado simple y el participio.</div>

    <div class="top">
      <span id="counter">1 / 20</span>
      <span>⭐ <span id="score">0</span> puntos</span>
    </div>

    <div class="progress"><div class="bar" id="bar"></div></div>

    <div class="verb" id="verb">go</div>
    <div class="translation" id="translation">ir</div>

    <div class="fields">
      <div>
        <label for="past">Past Simple</label>
        <input id="past" autocomplete="off" placeholder="Ej. went">
      </div>
      <div>
        <label for="participle">Past Participle</label>
        <input id="participle" autocomplete="off" placeholder="Ej. gone">
      </div>
    </div>

    <button id="check">Comprobar</button>
    <button class="secondary" id="next" style="display:none">Siguiente →</button>

    <div class="result" id="result"></div>
  </div>

  <div id="finish" class="finish hidden">
    <h1>🎉 ¡Quiz terminado!</h1>
    <div class="score" id="finalScore">0/20</div>
    <p id="finalText"></p>
    <button onclick="location.reload()">🔄 Repetir quiz</button>
  </div>
</div>

<script>
const verbs = [
  ["be", "was/were", "been", "ser/estar"],
  ["become", "became", "become", "convertirse"],
  ["begin", "began", "begun", "empezar"],
  ["break", "broke", "broken", "romper"],
  ["bring", "brought", "brought", "traer"],
  ["build", "built", "built", "construir"],
  ["buy", "bought", "bought", "comprar"],
  ["catch", "caught", "caught", "atrapar"],
  ["choose", "chose", "chosen", "elegir"],
  ["come", "came", "come", "venir"],
  ["do", "did", "done", "hacer"],
  ["drink", "drank", "drunk", "beber"],
  ["drive", "drove", "driven", "conducir"],
  ["eat", "ate", "eaten", "comer"],
  ["fall", "fell", "fallen", "caer"],
  ["feel", "felt", "felt", "sentir"],
  ["find", "found", "found", "encontrar"],
  ["fly", "flew", "flown", "volar"],
  ["forget", "forgot", "forgotten", "olvidar"],
  ["get", "got", "got/gotten", "conseguir"],
  ["give", "gave", "given", "dar"],
  ["go", "went", "gone", "ir"],
  ["have", "had", "had", "tener"],
  ["hear", "heard", "heard", "oír"],
  ["know", "knew", "known", "saber/conocer"],
  ["leave", "left", "left", "salir/dejar"],
  ["lose", "lost", "lost", "perder"],
  ["make", "made", "made", "hacer/fabricar"],
  ["meet", "met", "met", "conocer/encontrarse"],
  ["pay", "paid", "paid", "pagar"],
  ["put", "put", "put", "poner"],
  ["read", "read", "read", "leer"],
  ["ride", "rode", "ridden", "montar"],
  ["run", "ran", "run", "correr"],
  ["say", "said", "said", "decir"],
  ["see", "saw", "seen", "ver"],
  ["sell", "sold", "sold", "vender"],
  ["send", "sent", "sent", "enviar"],
  ["sing", "sang", "sung", "cantar"],
  ["sit", "sat", "sat", "sentarse"],
  ["sleep", "slept", "slept", "dormir"],
  ["speak", "spoke", "spoken", "hablar"],
  ["spend", "spent", "spent", "gastar/pasar"],
  ["stand", "stood", "stood", "estar de pie"],
  ["swim", "swam", "swum", "nadar"],
  ["take", "took", "taken", "coger/tomar"],
  ["teach", "taught", "taught", "enseñar"],
  ["tell", "told", "told", "decir/contar"],
  ["think", "thought", "thought", "pensar"],
  ["understand", "understood", "understood", "entender"],
  ["wear", "wore", "worn", "llevar puesto"],
  ["win", "won", "won", "ganar"],
  ["write", "wrote", "written", "escribir"]
];

let questions = [...verbs].sort(() => Math.random() - .5).slice(0, 20);
let current = 0;
let points = 0;
let checked = false;

const $ = id => document.getElementById(id);

function normalize(s) {
  return s.trim().toLowerCase().replace(/\s+/g, "");
}

function loadQuestion() {
  checked = false;
  const v = questions[current];
  $("verb").textContent = v[0];
  $("translation").textContent = v[3];
  $("counter").textContent = `${current + 1} / ${questions.length}`;
  $("score").textContent = points;
  $("bar").style.width = `${(current / questions.length) * 100}%`;
  $("past").value = "";
  $("participle").value = "";
  $("past").disabled = false;
  $("participle").disabled = false;
  $("check").style.display = "block";
  $("next").style.display = "none";
  $("result").style.display = "none";
  $("past").focus();
}

function isCorrect(input, answer) {
  const accepted = answer.split("/").map(x => normalize(x));
  const value = normalize(input);
  return accepted.includes(value);
}

$("check").addEventListener("click", () => {
  if (checked) return;
  checked = true;

  const v = questions[current];
  const pastOK = isCorrect($("past").value, v[1]);
  const partOK = isCorrect($("participle").value, v[2]);
  const both = pastOK && partOK;

  if (both) {
    points++;
    $("result").className = "result correct";
    $("result").innerHTML = "✅ ¡Correcto! +1 punto";
  } else {
    $("result").className = "result wrong";
    $("result").innerHTML =
      `❌ No del todo.<div class="answer">Respuesta: <b>${v[1]}</b> — <b>${v[2]}</b></div>`;
  }

  $("result").style.display = "block";
  $("score").textContent = points;
  $("past").disabled = true;
  $("participle").disabled = true;
  $("check").style.display = "none";
  $("next").style.display = "block";
});

$("next").addEventListener("click", () => {
  current++;
  if (current >= questions.length) {
    $("quiz").classList.add("hidden");
    $("finish").classList.remove("hidden");
    $("finalScore").textContent = `${points}/${questions.length}`;
    const percent = points / questions.length * 100;
    $("finalText").textContent =
      percent === 100 ? "🔥 Perfecto. Te sabes todos." :
      percent >= 80 ? "💪 Muy bien. Vas bastante preparado." :
      percent >= 60 ? "👍 Bien, pero conviene repasar algunos." :
      "📖 Toca repasar un poco más. ¡A por ello!";
    return;
  }
  loadQuestion();
});

$("past").addEventListener("keydown", e => {
  if (e.key === "Enter") $("participle").focus();
});
$("participle").addEventListener("keydown", e => {
  if (e.key === "Enter" && !checked) $("check").click();
  else if (e.key === "Enter" && checked) $("next").click();
});

loadQuestion();
</script>
</body>
</html>
